<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Strength Scalper - 4H + Scalping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💱 Currency Strength Scalper</h1>
            <p>4時間足環境 + 1分/5分足スキャルピング</p>
        </header>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">▶️ 開始</button>
            <button id="stopBtn" class="btn btn-stop" disabled>⏹️ 停止</button>
            <div class="status">
                <span id="statusText">準備中...</span>
                <span id="lastUpdate">最終更新: --:--:--</span>
            </div>
        </div>

        <!-- 4時間足環境セクション -->
        <div class="environment-section">
            <h2>🌍 4時間足 環境判定（参考情報）</h2>
            <div id="environmentContainer" class="environment-container">
                <p class="no-data">環境分析中...</p>
            </div>
        </div>

        <!-- シグナル設定 -->
        <div class="indicators">
            <div class="info-box">
                <h3>スキャルピング設定（1分/5分足）</h3>
                <ul>
                    <li>最小乖離: <strong id="configDivergence">3ポイント以上</strong></li>
                    <li>縮小速度: <strong id="configSpeed">0.5ポイント/tick以上</strong></li>
                    <li>更新間隔: <strong>1秒</strong></li>
                </ul>
            </div>
        </div>

        <!-- スキャルピングシグナル -->
        <div class="results">
            <h2>📊 スキャルピングシグナル（最新順）</h2>
            <div id="signalContainer" class="signal-container">
                <p class="no-signal">シグナル待機中...</p>
            </div>
        </div>

        <!-- チャート -->
        <div class="chart-area">
            <h2>📈 通貨強度チャート（1分/5分足ベース）</h2>
            <div id="chart" class="chart"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
